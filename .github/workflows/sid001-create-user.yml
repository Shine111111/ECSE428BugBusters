# TID021 - runs the unit tests and the ID_001 Create User acceptance tests on every push and pull request.
# Tests use an in-memory H2 database, so no Supabase credentials are needed.
name: SID001 Create User tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and ID_001 acceptance tests
        run: >
          ./gradlew :backend:test --console=plain
          -Dcucumber.features=classpath:gherkinFeatures/ID_001_Create_User.feature

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/build/reports/tests/test
            backend/build/reports/cucumber
