 */
plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    // JUnit 5
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // JUnit Platform Suite engine (needed to run @Suite)
    testImplementation 'org.junit.platform:junit-platform-suite:1.10.2'

    // Cucumber Java and JUnit Platform Engine
    testImplementation platform('io.cucumber:cucumber-bom:7.18.0')
    testImplementation 'io.cucumber:cucumber-java'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

tasks.register('recommendationAcceptanceTest', Test) {
    description = 'Run SID0021 recommendation acceptance tests'
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeEngines 'junit-platform-suite'
    }

    systemProperty 'cucumber.features',
        'classpath:gherkinFeatures/ID_021_Get_Personalized_Movie_Recommendations.feature'

    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}