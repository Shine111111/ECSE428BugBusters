# Replaces src/main/resources/application.properties on the test classpath.
# Tests run against an in-memory H2 database and never connect to Supabase.
spring.datasource.url=jdbc:h2:mem:bugbusters;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
