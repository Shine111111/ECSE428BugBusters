cucumber.glue=ca.mcgill.ecse428.bugbusters.stepdefinitions
# Report each scenario as "<feature> > <scenario> > <example>" so test results show the story and scenario
cucumber.junit-platform.naming-strategy=short
# Console output plus an HTML report at backend/build/reports/cucumber/cucumber.html
cucumber.plugin=pretty, html:build/reports/cucumber/cucumber.html
cucumber.features=classpath:gherkinFeatures
